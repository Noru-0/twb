# Single Dockerfile + Docker Compose for Small Project
# Uses SERVICE_TYPE environment variable to control behavior

version: '3.8'

services:
  # Main API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: bus-ticket-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - SERVICE_TYPE=api
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bus_ticket_dev
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=development-jwt-secret-change-in-production
      - PORT=3001
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bus-ticket-network
    command: ["npm", "run", "start:dev"]

  # Worker Service for Background Tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: bus-ticket-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SERVICE_TYPE=worker
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bus_ticket_dev
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bus-ticket-network
    command: ["npm", "run", "start:worker"]
    profiles:
      - worker

  # Migration Service (runs once)
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: bus-ticket-migration
    environment:
      - NODE_ENV=development
      - SERVICE_TYPE=migration
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bus_ticket_dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bus-ticket-network
    command: ["npm", "run", "migration:run"]
    restart: "no"
    profiles:
      - migration

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bus-ticket-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=bus_ticket_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - bus-ticket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bus_ticket_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bus-ticket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis-password
    volumes:
      - redis_data:/data
    networks:
      - bus-ticket-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis-password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # pgAdmin for Database Management (Development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bus-ticket-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@busticket.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - bus-ticket-network
    profiles:
      - tools

  # Redis Commander for Redis Management (Development only)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: bus-ticket-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis-password
    depends_on:
      - redis
    networks:
      - bus-ticket-network
    profiles:
      - tools

  # Nginx for Load Balancing (Production ready)
  nginx:
    image: nginx:alpine
    container_name: bus-ticket-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - bus-ticket-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  bus-ticket-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16