version: '3.8'

services:
  # Database for development
  postgres-dev:
    image: postgres:15-alpine
    container_name: bus-ticket-backend-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bus_ticket_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init-dev.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-dev-network

  # Redis for caching (optional)
  redis-dev:
    image: redis:7-alpine
    container_name: bus-ticket-backend-redis-dev
    ports:
      - "6379:6379"
    networks:
      - backend-dev-network
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data

  # Backend development with hot reload
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bus-ticket-backend-dev
    ports:
      - "3000:3000"
      - "9229:9229"  # Debug port
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=postgres-dev
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=bus_ticket_dev
      - REDIS_URL=redis://redis-dev:6379
      - JWT_SECRET=dev-jwt-secret-key
    depends_on:
      - postgres-dev
      - redis-dev
    networks:
      - backend-dev-network
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:debug

networks:
  backend-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data: